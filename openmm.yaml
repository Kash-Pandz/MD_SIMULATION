name: openmm_sim
channels:
  - psi4
  - conda-forge/label/libint_dev
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - openmm=8.1.1
  - cudatoolkit=12.2
  - rdkit=2024.9.5
  - ambertools=23.6
  - psi4
  - resp
  - openbabel
  - pip
  - pip:
      # Installed via pip (also available on Conda, but faster via pip)
      - parmed=4.2.2
      - mdtraj=1.10.3
      - mdanalysis=2.8.0
      - numpy=1.26.4
      - scipy=1.14.1
      - biopython=1.84
      - biotite=1.1.0
      - acpype=2023.10.27
      - matplotlib
      - seaborn
      - pandas
      - loguru=0.7.3
      - cython
